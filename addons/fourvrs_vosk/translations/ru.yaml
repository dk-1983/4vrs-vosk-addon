configuration:
  model:
    name: Модель распознавания
    description: ru-0.42 — полная русская модель, проверенная с домофоном. Малые модели требуют меньше памяти, но могут распознавать иначе. Доступны и английские модели. Язык распознавателя в HA должен совпадать с моделью.
  auto_download:
    name: Загружать отсутствующую модель
    description: Загрузить выбранную модель с сайта Alpha Cephei при первом запуске. Модели хранятся в /share/fourvrs_vosk/models и сохраняются при обновлении дополнения. Для скопированной вручную модели можно отключить.
  log_level:
    name: Уровень журнала
    description: Подробность диагностики. Текст речи и аудио не записываются в журнал дополнения, в том числе в режиме debug.
network:
  10301/tcp: Порт Wyoming STT для Home Assistant. Только локальная сеть; это не защищённый паролем интернет-сервис.
